<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>NFT-PREVIEW-CARD</title>
  </head>
  <body>
    <section class="card-container">
      <img
        src="./images/image-equilibrium.jpg"
        alt="card-image"
        class="card-image"
      />
      <header>
        <h1 class="card-title">Equilibrium #3429</h1>
      </header>

      <p class="content">
        Our Equilibrium collection promotes balances and calm
      </p>

      <div class="card-values">
        <img src="./images/icon-ethereum.svg" alt="text-icon" />
        0.041 ETH
      </div>
      <div>
        <img src="./images/icon-clock.svg " alt="icon-clock" />
        3 days left
      </div>
      <hr class="card-divider" />

      <footer class="card-footer">
        <img
          class="creator-avatar"
          src="./images/image-avatar.png"
          alt="profile-image"
        />
        <h2 class="creator-name">creation of jules wyvern</h2>
      </footer>
    </section>
  </body>
</html>
