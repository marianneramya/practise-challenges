<!doctype html>
<html lang="en">
  <link rel="stylesheet" href="style.css" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT-PREVIEW-CARD</title>
  </head>
  <body>
    <card class="card-container">
      <img
        src="./images/image-equilibrium.jpg"
        alt="Equilibrium-image"
        class="card-image"
      />
      <h1 class="card-title">Equilibrium #3429</h1>
      <p class="content">
        Our Equilibrium collection promotes balances and calm
      </p>
      <div>
        <p class="value">
          <img src="./images/icon-ethereum.svg" alt="text-icon" />
          0.041 ETH
        </p>
        <p class="deadline">
          <img src="./images/icon-clock.svg " alt="icon-clock" />3 days left
        </p>
      </div>
      <hr />

      <footer>
        <p>
          <img
            class="avatar-image"
            src="./images/image-avatar.png"
            alt="profile-image"
          />
        </p>
        <h2 class="creator-name">creation of jules wyvern</h2>
      </footer>
    </card>
  </body>
</html>
