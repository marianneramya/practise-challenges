<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>NFT-PREVIEW-CARD</title>
  </head>
  <body>
    <section class="card-container">
      <img
        src="./images/image-equilibrium.jpg"
        alt="card-image"
        class="card-image"
      />
      <header>
        <h1 class="card-title">Equilibrium #3429</h1>
      </header>

      <p>Our Equilibrium collection promotes balances and calm</p>
      <div class="div-container">
        <div class="card-values">
          <img
            class="stats-image"
            src="./images/icon-ethereum.svg"
            alt="text-icon"
          />
          0.041 ETH
        </div>
        <div class="deadline">
          <img
            class="stats-image"
            src="./images/icon-clock.svg "
            alt="icon-clock"
          />
          3 days left
        </div>
      </div>

      <footer>
        <img
          class="creator-avatar"
          src="./images/image-avatar.png"
          alt="profile-image"
        />
        <h2 class="creator-name"><span>creation Of</span> Jules Wyvern</h2>
      </footer>
    </section>
  </body>
</html>
